<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taskify — Auth</title>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0b; --surface: #111113; --surface2: #18181c;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --text: #e8e8ea; --text2: #7a7a88; --text3: #44444f;
  --accent: #a78bfa; --accent-bg: rgba(167,139,250,0.08); --accent-border: rgba(167,139,250,0.2);
  --green: #4ade80; --red: #f87171;
  --font-display: 'Oxanium', sans-serif; --font-mono: 'JetBrains Mono', monospace;
}
html, body { height: 100%; }
body { font-family: var(--font-display); background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: linear-gradient(rgba(167,139,250,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(167,139,250,0.03) 1px, transparent 1px); background-size: 60px 60px; }
* { position: relative; z-index: 1; }
.back-link { position: fixed; top: 24px; left: 32px; font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-decoration: none; letter-spacing: 0.06em; transition: color 0.2s; }
.back-link:hover { color: var(--accent); }
.card { width: 100%; max-width: 400px; background: var(--surface); border: 0.5px solid var(--border2); border-radius: 16px; padding: 40px 36px; }
.card-logo { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 28px; display: block; text-align: center; }
.card-title { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; text-align: center; }
.card-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-align: center; margin-bottom: 32px; letter-spacing: 0.04em; }
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.field label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); }
.field input { width: 100%; font-family: var(--font-mono); font-size: 13px; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px; padding: 11px 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--accent-border); }
.field input::placeholder { color: var(--text3); }
.error-msg { font-family: var(--font-mono); font-size: 11px; color: var(--red); background: rgba(248,113,113,0.08); border: 0.5px solid rgba(248,113,113,0.2); border-radius: 6px; padding: 9px 12px; margin-bottom: 16px; display: none; }
.error-msg.show { display: block; }
.submit-btn { width: 100%; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; padding: 13px; background: var(--accent); border: none; border-radius: 8px; color: #0a0a0b; cursor: pointer; transition: all 0.2s; margin-top: 6px; }
.submit-btn:hover { background: #b9a2ff; }
.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
.divider-line { flex: 1; height: 0.5px; background: var(--border2); }
.divider-text { font-family: var(--font-mono); font-size: 10px; color: var(--text3); letter-spacing: 0.06em; }
.switch-link { text-align: center; font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
.switch-link a { color: var(--accent); text-decoration: none; }
.switch-link a:hover { text-decoration: underline; }
.success-state { text-align: center; display: none; flex-direction: column; align-items: center; gap: 14px; }
.success-state.show { display: flex; }
.success-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(74,222,128,0.1); border: 0.5px solid rgba(74,222,128,0.3); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--green); }
.success-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
.success-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
</style>
</head>
<body>

<a href="index.html" class="back-link">← back</a>

<div class="card">
  <span class="card-logo">Taskify</span>
  <div id="form-state">
    <div class="card-title" id="card-title">Create account</div>
    <div class="card-sub" id="card-sub">start automating your tasks for free</div>
    <div style="margin-top: 28px;">
      <div class="field" id="name-field">
        <label>Name</label>
        <input type="text" id="name-input" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">Create account</button>
      <div class="divider"><div class="divider-line"></div><div class="divider-text">or</div><div class="divider-line"></div></div>
      <div class="switch-link" id="switch-link">Already have an account? <a href="auth.html?mode=login">Log in</a></div>
    </div>
  </div>
  <div class="success-state" id="success-state">
    <div class="success-icon">✓</div>
    <div class="success-title" id="success-title">Welcome!</div>
    <div class="success-sub">Redirecting you to the app...</div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const isLogin = params.get('mode') === 'login';

// Always clear the current session when visiting the auth page
// so a stuck/failed session never blocks the form
localStorage.removeItem('taskify_user');

if (isLogin) {
  document.getElementById('card-title').textContent = 'Welcome back';
  document.getElementById('card-sub').textContent = 'log in to your Taskify account';
  document.getElementById('name-field').style.display = 'none';
  document.getElementById('submit-btn').textContent = 'Log in';
  document.getElementById('switch-link').innerHTML = "Don't have an account? <a href='auth.html?mode=signup'>Sign up</a>";
}

function getUsers() {
  try { return JSON.parse(localStorage.getItem('taskify_users') || '{}'); } catch(e) { return {}; }
}

function hashPass(p) {
  try { return btoa(unescape(encodeURIComponent(p))); } catch(e) { return btoa(p); }
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}

function handleSubmit() {
  document.getElementById('error-msg').classList.remove('show');

  const email = document.getElementById('email-input').value.trim().toLowerCase();
  const password = document.getElementById('password-input').value;
  const name = document.getElementById('name-input').value.trim();

  if (!email || !password) { showError('Please fill in all fields.'); return; }
  if (!email.includes('@')) { showError('Please enter a valid email.'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

  const users = getUsers();

  if (isLogin) {
    const user = users[email];
    if (!user) { showError('No account found. Please sign up first.'); return; }
    if (user.password !== hashPass(password)) { showError('Incorrect password.'); return; }
    localStorage.setItem('taskify_user', JSON.stringify({ email, name: user.name }));
    showSuccess(user.name);
  } else {
    if (!name) { showError('Please enter your name.'); return; }
    if (users[email]) { showError('Account already exists. Log in instead.'); return; }
    users[email] = { name, password: hashPass(password) };
    localStorage.setItem('taskify_users', JSON.stringify(users));
    localStorage.setItem('taskify_user', JSON.stringify({ email, name }));
    showSuccess(name);
  }
}

function showSuccess(name) {
  document.getElementById('form-state').style.display = 'none';
  document.getElementById('success-state').classList.add('show');
  document.getElementById('success-title').textContent = 'Welcome, ' + name + '!';
  setTimeout(() => { window.location.href = 'app.html'; }, 1400);
}

['email-input', 'password-input', 'name-input'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') handleSubmit(); });
});
</script>
</body>
</html>
